name: Deploy

# Push to main → CI → Supabase migrations → (optional) Vercel production via
# Actions → fast-forward the `live` branch.
#
# Hosting: by default Vercel's Git integration deploys every push (previews for
# PRs, production for main). To deploy from Actions instead, set the repository
# variable DEPLOY_WITH_ACTIONS=true, add VERCEL_TOKEN / VERCEL_ORG_ID /
# VERCEL_PROJECT_ID secrets, and turn off Git deployments in Vercel.
#
# Database: add SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD
# secrets and migrations run automatically; without them the job skips with a
# notice (apply supabase/migrations by hand — see docs/DEPLOYMENT.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  preview:
    name: Vercel preview (Actions)
    if: >-
      github.event_name == 'pull_request' && vars.DEPLOY_WITH_ACTIONS == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build & deploy preview
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Supabase migrations
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping migrations (apply supabase/migrations manually)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: latest
      - name: Push migrations
        if: steps.check.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          supabase db push

  production:
    name: Vercel production (Actions)
    needs: migrate
    if: vars.DEPLOY_WITH_ACTIONS == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build & deploy production
        id: deploy
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/health"

  promote-live:
    name: Update `live` branch
    needs: [ci, migrate, production]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' && needs.migrate.result == 'success' &&
      (needs.production.result == 'success' || needs.production.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward live → ${{ github.sha }}
        run: |
          # Plain push = fast-forward only. If someone committed directly to
          # `live` this fails loudly instead of discarding their work.
          git push origin "${{ github.sha }}:refs/heads/live"
          echo "### \`live\` now points at ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
